<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colgrup com span</title>
     <style>
        body {
           font-family: Arial, Helvetica, sans-serif;
          
        }

        table{
            width: 500px;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        caption {
            font-size: 1.8em;
            padding: 8px;
        }

        col.nome {
            background-color: aqua;
        }

        col.sexo {
            background-color: blueviolet;
        }

        col.idade {
            background-color: yellow;
        }

        col.profissão {
            background-color: springgreen;
        }
    </style>
</head>
<body>

    <table>
        <caption>
            Colgrup com Span
        </caption>

        <colgroup>
            <col class="nome">
            <col class="sexo">
            <col class="idade">
            <col class="profissão">
        </colgroup>

        <tr>
            <th>nome</th>
            <th>sexo</th>
            <th>idade</th>
            <th>profissão</th>
        </tr>

        <tr>
            <td>joão</td>
            <td>m</td>
            <td>25</td>
            <td>artesão</td>
        </tr>

          <tr>
            <td>maria</td>
            <td>f</td>
            <td>25</td>
            <td>artesão</td>
        </tr>

          <tr>
            <td>ana</td>
            <td>f</td>
            <td>25</td>
            <td>artesão</td>
        </tr>

          <tr>
            <td>thereza</td>
            <td>f</td>
            <td>25</td>
            <td>artesão</td>
        </tr>
    </table>
    
</body>
</html>
