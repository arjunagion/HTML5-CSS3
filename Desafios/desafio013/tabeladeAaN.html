<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela de 15</title>
    <style>
        body {

            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            height: 500px;
            border-radius: 15px;
            border-width: 5px;
            border-style: outset;
            background-color: blueviolet;
        }

        td {
            border-radius: 15px;
            border: 3px solid yellow;
            text-align: center;
            padding: 10px;
        }

        tr:nth-child(odd) {
            background-color: rgb(56, 1, 107);
            color: white;
            font-size: 1.5em;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <h1>TABELA DE A À M</h1>
    <table>
        <tr>
            <td colspan="4">A</td>
            <td rowspan="4">B</td>
        </tr>

         <tr>
            <td rowspan="4">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>

         <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>

         <tr>
            <td>J</td>
            <td>K</td>
            <td>L</td>
        </tr>

         <tr>
            <td colspan="4">M</td>
        </tr>


    </table>
</body>
</html>
