<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
    <style>
       td, th {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table>

        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Diciplina</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <td>notas 1</td>
                <td>notas 2</td>
            </tr>
        </thead>

        <tbody>

            <tr>
                <th rowspan="5">EXATAS</th>
            </tr>

            <tr>
                <td>matematica</td>
                <td>10.00</td>
                <td>10.00</td>
                <td>10.00</td>
            </tr>

            <tr>
                <td>fisica</td>
                <td>10.00</td>
                <td>10.00</td>
                <td>10.00</td>
            </tr>

            <tr>
                <td>biologia</td>
                <td>10.00</td>
                <td>10.00</td>
                <td>10.00</td>
            </tr>
            
            <tr>
                <td>quimica</td>
                <td>10.00</td>
                <td>10.00</td>
                <td>10.00</td>
            </tr>

        </tbody>

    </table>
</body>
</html>
